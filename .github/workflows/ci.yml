name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  image:
    name: Build image
    # The action is a container action, so a Dockerfile that no longer builds breaks every consumer. Validate it on every change; nothing is pushed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: suggest-version-action:ci

  action:
    name: Action metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Marketplace rejects a release whose action.yml is malformed, and it does so only at publish time. Catching it here keeps that failure off the release path.
      - name: Validate action.yml
        run: |
          python3 - <<'PY'
          import sys, yaml

          with open("action.yml") as fh:
              meta = yaml.safe_load(fh)

          errors = []
          for field in ("name", "description", "runs"):
              if not meta.get(field):
                  errors.append(f"action.yml is missing the required `{field}` field")

          declared = set(meta.get("outputs", {}))
          expected = {"version", "latest", "major", "minor", "patch", "alpha", "beta", "rc"}
          if declared != expected:
              errors.append(f"declared outputs {sorted(declared)} do not match the documented set {sorted(expected)}")

          for name, spec in (meta.get("inputs") or {}).items():
              if not (spec or {}).get("description"):
                  errors.append(f"input `{name}` has no description")

          if errors:
              print("\n".join(f"::error::{e}" for e in errors))
              sys.exit(1)
          print("action.yml looks well-formed")
          PY

  smoke:
    name: Smoke test
    # Runs the action end to end against a stub API, so the wiring the unit tests cannot reach — input plumbing, $GITHUB_OUTPUT, the container entrypoint — is exercised on every change. It uses no secrets, so it also runs on pull requests from forks.
    #
    # Do not add service containers to this job. They would put the action on a per-job network, and the stub address resolved below assumes the default bridge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stub API
        id: stub
        run: |
          mkdir -p /tmp/stub/v1/artefacts/0123456789abcdef01234567
          cat > /tmp/stub/v1/artefacts/0123456789abcdef01234567/suggested-versions <<'JSON'
          {"suggested_version":"1.2.4","increments":{"major":"2.0.0","minor":"1.3.0","patch":"1.2.4"},"latest":"1.2.3","pre_releases":{"alpha":"1.2.4-alpha.1","beta":"1.2.4-beta.1","rc":"1.2.4-rc.1"}}
          JSON
          # Bind on every interface: the action runs in a container, so it reaches this over the docker bridge rather than on the loopback the stub would otherwise get.
          python3 -m http.server 8080 --bind 0.0.0.0 --directory /tmp/stub &

          gateway="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          echo "api-url=http://${gateway}:8080" >> "$GITHUB_OUTPUT"

          # Prove the address works from inside a container before the action depends on it, so a networking change fails here with an obvious message instead of surfacing as a confusing action error.
          for _ in $(seq 1 20); do
            if docker run --rm curlimages/curl:latest -sf "http://${gateway}:8080/v1/artefacts/0123456789abcdef01234567/suggested-versions" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::stub API was not reachable from a container at http://${gateway}:8080"
          exit 1

      - name: Run the action
        id: suggest
        uses: ./
        with:
          api-url: ${{ steps.stub.outputs.api-url }}
          token: stub-token
          artefact-id: 0123456789abcdef01234567
          bump: minor

      - name: Assert outputs
        env:
          VERSION: ${{ steps.suggest.outputs.version }}
          LATEST: ${{ steps.suggest.outputs.latest }}
          RC: ${{ steps.suggest.outputs.rc }}
        run: |
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::output $1 = '$2', expected '$3'"
              fail=1
            fi
          }
          check version "$VERSION" "1.3.0"   # bump: minor selects increments.minor
          check latest "$LATEST" "1.2.3"
          check rc "$RC" "1.2.4-rc.1"        # every variant is emitted regardless of bump
          exit $fail
