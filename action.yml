# Marketplace requires action.yml at the repository root, which is why this action lives in its own repository.
name: 'ArtefactFlow Suggest Version'
description: 'Fetch the suggested next version for an ArtefactFlow artefact and expose it as an output for tagging, changelogs, and releases.'
author: 'ArtefactFlow'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  api-url:
    description: 'Base URL of the ArtefactFlow API, for example https://api.artefactflow.example. Supplied by the operator; never hard-coded.'
    required: true
  token:
    description: 'Bearer token with the artefact:read scope. Pass it from a secret — never inline it in the workflow file.'
    required: true
  artefact-id:
    description: "The artefact's 24-character hex id. Artefacts are addressed by id, not by name."
    required: true
  bump:
    description: 'Which suggestion becomes the `version` output: suggested (default), major, minor, patch, alpha, beta, or rc. All variants are always available as their own outputs.'
    required: false
    default: 'suggested'

outputs:
  version:
    description: 'The selected suggestion, per the `bump` input. Defaults to the version the API suggests.'
  latest:
    description: "The artefact's current latest version. Empty when the artefact has no released version yet."
  major:
    description: 'The next version with the major level incremented.'
  minor:
    description: 'The next version with the minor level incremented.'
  patch:
    description: 'The next version with the patch level incremented.'
  alpha:
    description: 'The alpha pre-release variant of the suggested version.'
  beta:
    description: 'The beta pre-release variant of the suggested version.'
  rc:
    description: 'The release-candidate pre-release variant of the suggested version.'

runs:
  using: 'docker'
  # Built from source on the runner. Once the release workflow has published an image, switch this to the pre-built image so each run pulls instead of builds:
  #   image: 'docker://ghcr.io/artefactflow/suggest-version-action:v1'
  image: 'Dockerfile'
